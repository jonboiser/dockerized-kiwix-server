services:
  kiwix-serve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiwix-serve
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./zims:/zims
    environment:
      - ZIMDIR=/zims

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiwix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./zims:/zims
    environment:
      - ZIMDIR=/zims
      - KIWIX_SERVER_URL=http://kiwix-serve:8080
    depends_on:
      - kiwix-serve
